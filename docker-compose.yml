services:
  backend-api:
    build:
      context: ./backend
    container_name: hu-icd-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  frontend-app:
    build:
      context: ./frontend
    container_name: hu-icd-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-api